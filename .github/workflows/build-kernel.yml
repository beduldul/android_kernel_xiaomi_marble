name: Build Chandelier POCO F5 Kernel

on:
  push:
    branches:
      - main
      - melt-rebase
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex bc libssl-dev libelf-dev clang lld llvm git python3 cpio zip rsync gawk

      - name: Configure Kernel
        run: |
          make ARCH=arm64 SUBARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 marble_defconfig

      - name: Compile Kernel Image.gz
        run: |
          make -j$(nproc --all) ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 Image.gz

      - name: Package AnyKernel3 Zip
        run: |
          mkdir -p anykernel_out
          cp arch/arm64/boot/Image.gz anykernel_out/Image.gz || cp arch/arm64/boot/Image anykernel_out/Image
          cp -r tools anykernel_out/ 2>/dev/null || true
          cp anykernel.sh anykernel_out/ 2>/dev/null || true
          cp banner anykernel_out/ 2>/dev/null || true
          cp -r META-INF anykernel_out/ 2>/dev/null || true
          cd anykernel_out
          zip -r9 ../Chandelier-Oreshnik-Kernel-Marble-GKI.zip .

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chandelier-Oreshnik-Kernel-Marble-GKI
          path: Chandelier-Oreshnik-Kernel-Marble-GKI.zip
